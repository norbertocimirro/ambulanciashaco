<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - HACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root {
            --bg-base: #F8FAFC; 
            --fab-blue: #003366; 
            --fab-red: #DC2626;  
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: #0F172A; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar - Fina e Elegante para o Desktop */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ⚠️ SUA API ATUALIZADA AQUI ⚠️
        const API_URL = "https://script.google.com/macros/s/AKfycbzaxizVCggOIIjdUVyEz7Yk-8YemrsG5HZ9thMdl_DDzok2T120mggXfkZYj5S4PoAT/exec";

        const VIATURAS = [
            { id: 'basica_upi', label: 'BÁSICA (UPI)' },
            { id: 'avancada_upa', label: 'AVANÇADA (UPA)' },
            { id: 'avancada_paje', label: 'PAJÉ (TÁTICA)' }
        ];

        function Dashboard() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState(false);

            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [filterAlerts, setFilterAlerts] = useState(false);
            const [search, setSearch] = useState('');
            const [selectedChecklist, setSelectedChecklist] = useState(null);

            useEffect(() => {
                const timer = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
                return () => clearTimeout(timer);
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (username.toLowerCase() === 'haco' && password === 'haco2026') {
                    setIsAuthenticated(true);
                    setLoginError(false);
                    fetchHistory();
                } else {
                    setLoginError(true);
                    setPassword('');
                }
            };

            const fetchHistory = async () => {
                setLoading(true);
                try {
                    const r = await fetch(`${API_URL}?action=read_history`);
                    const result = await r.json();
                    if (Array.isArray(result)) setData(result);
                } catch (e) { console.error("Erro na API", e); }
                setLoading(false);
            };

            const filteredData = useMemo(() => {
                let filtered = data;
                if (filterAlerts) filtered = filtered.filter(d => d.alertas > 0);
                if (search) {
                    const s = search.toLowerCase();
                    filtered = filtered.filter(d => 
                        d.tipo.toLowerCase().includes(s) || d.resp.toLowerCase().includes(s) || 
                        d.motorista.toLowerCase().includes(s) || d.placa.toLowerCase().includes(s)
                    );
                }
                return filtered;
            }, [data, filterAlerts, search]);

            const stats = useMemo(() => {
                const hoje = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
                const checksHoje = data.filter(d => d.dataVerificacao === hoje).length;
                const comAlertas = data.filter(d => d.alertas > 0).length;
                return { checksHoje, comAlertas, total: data.length };
            }, [data]);

            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                if(dateStr.includes('-')) return dateStr.split('-').reverse().join('/');
                return dateStr;
            };

            // CONTROLE DE TURNOS (Monitor M, T, N)
            const turnosData = useMemo(() => {
                const hojeStr = new Date().toLocaleDateString('en-CA');
                const currentHour = new Date().getHours();
                
                return VIATURAS.map(v => {
                    const logsHoje = data.filter(d => d.tipo === v.label && d.dataVerificacao === hojeStr);
                    
                    const checkM = logsHoje.some(d => { const h = parseInt(d.horaVerificacao.split(':')[0]); return h >= 7 && h < 13; });
                    const checkT = logsHoje.some(d => { const h = parseInt(d.horaVerificacao.split(':')[0]); return h >= 13 && h < 19; });
                    const checkN = logsHoje.some(d => { const h = parseInt(d.horaVerificacao.split(':')[0]); return h >= 19 || h < 7; });

                    const getStatus = (isDone, start, end) => {
                        if (isDone) return { text: 'REALIZADO', bg: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
                        // Lógica para Noite (19h as 07h)
                        if (start === 19) {
                             if (currentHour >= 7 && currentHour < 19) return { text: 'FALTOU', bg: 'bg-red-100 text-red-700 border-red-200' };
                             return { text: 'PENDENTE', bg: 'bg-amber-100 text-amber-700 border-amber-200' };
                        }
                        // Lógica para Manhã e Tarde
                        if (currentHour >= end) return { text: 'FALTOU', bg: 'bg-red-100 text-red-700 border-red-200' };
                        if (currentHour >= start && currentHour < end) return { text: 'PENDENTE', bg: 'bg-amber-100 text-amber-700 border-amber-200' };
                        return { text: 'AGUARDE', bg: 'bg-slate-100 text-slate-400 border-slate-200' };
                    };

                    return {
                        label: v.label,
                        M: getStatus(checkM, 7, 13),
                        T: getStatus(checkT, 13, 19),
                        N: getStatus(checkN, 19, 7)
                    };
                });
            }, [data]);

            // ================= TELA DE LOGIN =================
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 animate-fade">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-xl shadow-xl max-w-sm w-full space-y-8 border-t-8 border-[#003366]">
                            <div className="text-center">
                                <div className="bg-[#003366] w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-md">
                                    <i data-lucide="shield-check" className="text-white w-8 h-8"></i>
                                </div>
                                <h1 className="text-2xl font-black text-[#003366] uppercase tracking-tight">Ambulâncias HACO</h1>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Portal do Gestor</p>
                            </div>
                            {loginError && (<div className="bg-red-50 text-red-600 text-xs font-bold p-3 rounded text-center border border-red-200 uppercase tracking-wider">Credenciais inválidas.</div>)}
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-[11px] font-black text-slate-500 uppercase mb-2 tracking-wider">Usuário</label>
                                    <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-lg bg-slate-50 outline-none focus:border-[#003366] text-sm font-bold text-slate-800" placeholder="Digite 'haco'" required />
                                </div>
                                <div>
                                    <label className="block text-[11px] font-black text-slate-500 uppercase mb-2 tracking-wider">Senha</label>
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-lg bg-slate-50 outline-none focus:border-[#003366] text-sm font-bold text-slate-800" placeholder="••••••••" required />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-[#003366] text-white p-4 rounded-lg font-black uppercase tracking-widest hover:bg-blue-900 transition-all shadow-md active:scale-95 flex justify-center items-center gap-2">
                                Acessar Painel <i data-lucide="arrow-right" className="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                );
            }

            // ================= DASHBOARD =================
            return (
                <div className="min-h-screen flex flex-col bg-slate-50 animate-fade">
                    <header className="bg-[#003366] text-white p-5 shadow-md flex justify-between items-center z-50 sticky top-0 h-[80px]">
                        <div className="flex items-center gap-4">
                            <div className="bg-white/10 p-2 rounded-lg"><i data-lucide="shield-check" className="w-7 h-7"></i></div>
                            <div>
                                <h1 className="text-xl font-black uppercase tracking-wider">Painel de Verificações</h1>
                                <p className="text-[10px] text-blue-200 font-mono tracking-widest uppercase">Ambulâncias HACO</p>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={fetchHistory} className="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-colors text-xs font-bold uppercase tracking-wider">
                                <i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`}></i> Atualizar
                            </button>
                            <button onClick={() => { setIsAuthenticated(false); setUsername(''); setPassword(''); setData([]); setSelectedChecklist(null); }} className="flex items-center gap-2 bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition-colors text-xs font-bold uppercase tracking-wider shadow-sm">
                                <i data-lucide="log-out" className="w-4 h-4"></i> Sair
                            </button>
                        </div>
                    </header>

                    {/* ALINHAMENTO FIXADO PARA O GRID */}
                    <main className="flex-1 p-6 max-w-[1400px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        
                        {/* Coluna Esquerda: Acompanha o Scroll da Página normalmente */}
                        <div className="lg:col-span-8 space-y-6">
                            
                            {/* KPI Cards */}
                            <div className="grid grid-cols-3 gap-4">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 border-l-4 border-blue-500">
                                    <div className="bg-blue-50 p-3 rounded-full text-blue-600"><i data-lucide="clipboard-list"></i></div>
                                    <div>
                                        <p className="text-[11px] font-black text-slate-500 uppercase tracking-wider">Total Registros</p>
                                        <p className="text-2xl font-black text-slate-800">{stats.total}</p>
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 border-l-4 border-emerald-500">
                                    <div className="bg-emerald-50 p-3 rounded-full text-emerald-600"><i data-lucide="calendar-check"></i></div>
                                    <div>
                                        <p className="text-[11px] font-black text-slate-500 uppercase tracking-wider">Verificações Hoje</p>
                                        <p className="text-2xl font-black text-slate-800">{stats.checksHoje}</p>
                                    </div>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 border-l-4 border-red-500">
                                    <div className="bg-red-50 p-3 rounded-full text-red-600"><i data-lucide="alert-triangle"></i></div>
                                    <div>
                                        <p className="text-[11px] font-black text-slate-500 uppercase tracking-wider">Pendências</p>
                                        <p className="text-2xl font-black text-red-600">{stats.comAlertas}</p>
                                    </div>
                                </div>
                            </div>

                            {/* ALERTA DE TURNOS */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-50 border-b border-slate-200 p-3">
                                    <h3 className="text-xs font-black uppercase text-slate-600 tracking-wider flex items-center gap-2">
                                        <i data-lucide="clock" className="w-4 h-4 text-[#003366]"></i> Controle de Turnos (Status de Hoje)
                                    </h3>
                                </div>
                                <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {turnosData.map(v => (
                                        <div key={v.label} className="border border-slate-100 rounded-lg p-3 shadow-sm">
                                            <h4 className="text-[11px] font-black uppercase text-[#003366] tracking-tight mb-3 text-center">{v.label}</h4>
                                            <div className="flex justify-between gap-2">
                                                <div className="flex flex-col items-center flex-1">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase mb-1">M (07h-13h)</span>
                                                    <span className={`text-[9px] font-black px-1.5 py-1 rounded w-full text-center border ${v.M.bg}`}>{v.M.text}</span>
                                                </div>
                                                <div className="flex flex-col items-center flex-1">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase mb-1">T (13h-19h)</span>
                                                    <span className={`text-[9px] font-black px-1.5 py-1 rounded w-full text-center border ${v.T.bg}`}>{v.T.text}</span>
                                                </div>
                                                <div className="flex flex-col items-center flex-1">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase mb-1">N (19h-07h)</span>
                                                    <span className={`text-[9px] font-black px-1.5 py-1 rounded w-full text-center border ${v.N.bg}`}>{v.N.text}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Barra de Filtros */}
                            <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center gap-4">
                                <div className="relative flex-1">
                                    <i data-lucide="search" className="absolute left-4 top-3 text-slate-400 w-4 h-4"></i>
                                    <input type="text" placeholder="Buscar por placa, motorista..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-[#003366] outline-none font-bold text-slate-700" value={search} onChange={e => setSearch(e.target.value)} />
                                </div>
                                <button onClick={() => setFilterAlerts(!filterAlerts)} className={`px-4 py-2.5 rounded-lg text-xs font-black uppercase tracking-wider flex items-center gap-2 transition-colors border ${filterAlerts ? 'bg-red-50 text-red-700 border-red-200' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
                                    <i data-lucide="filter" className="w-4 h-4"></i> {filterAlerts ? 'Mostrando PENDÊNCIAS' : 'Filtrar PENDÊNCIAS'}
                                </button>
                            </div>

                            {/* Tabela de Histórico */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-10">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 border-b border-slate-200">
                                            <th className="p-4 text-[10px] font-black uppercase tracking-wider text-slate-500">Data / Hora</th>
                                            <th className="p-4 text-[10px] font-black uppercase tracking-wider text-slate-500">Viatura</th>
                                            <th className="p-4 text-[10px] font-black uppercase tracking-wider text-slate-500">Equipe</th>
                                            <th className="p-4 text-[10px] font-black uppercase tracking-wider text-slate-500 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredData.length === 0 ? (
                                            <tr><td colSpan="4" className="p-8 text-center text-slate-400 font-bold uppercase text-xs tracking-wider">{loading ? 'Carregando dados da API...' : 'Nenhum registro encontrado.'}</td></tr>
                                        ) : filteredData.map((row, index) => (
                                            <tr key={row.id || index} onClick={() => setSelectedChecklist(row)} className={`hover:bg-blue-50 cursor-pointer transition-colors ${selectedChecklist?.id === row.id ? 'bg-blue-50 border-l-4 border-l-[#003366]' : 'border-l-4 border-l-transparent'}`}>
                                                <td className="p-4">
                                                    <p className="font-bold text-slate-800 text-sm">{formatDate(row.dataVerificacao)}</p>
                                                    <p className="text-xs text-slate-500 font-mono">{row.horaVerificacao}</p>
                                                </td>
                                                <td className="p-4">
                                                    <p className="font-black text-slate-800 text-sm tracking-tight">{row.tipo}</p>
                                                    <p className="text-xs text-slate-500 font-mono uppercase">{row.placa}</p>
                                                </td>
                                                <td className="p-4">
                                                    <p className="text-xs font-bold text-slate-700 uppercase">Resp: {row.resp}</p>
                                                    <p className="text-xs font-bold text-slate-500 uppercase mt-0.5">Mot: {row.motorista}</p>
                                                </td>
                                                <td className="p-4 text-center">
                                                    {row.alertas > 0 ? (
                                                        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[10px] font-black bg-red-100 text-red-700 border border-red-200 tracking-wider">
                                                            <i data-lucide="triangle-alert" className="w-3 h-3"></i> {row.alertas} PENDÊNCIAS
                                                        </span>
                                                    ) : (
                                                        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[10px] font-black bg-emerald-100 text-emerald-700 border border-emerald-200 tracking-wider">
                                                            <i data-lucide="check" className="w-3 h-3"></i> CONFORME
                                                        </span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Coluna Direita: O SEGREDO DO SCROLL ESTÁ AQUI (Fica fixo na tela) */}
                        <div className="lg:col-span-4 sticky top-[104px] h-[calc(100vh-128px)]">
                            <div className="bg-white rounded-xl shadow-lg border border-slate-200 flex flex-col h-full overflow-hidden">
                                {selectedChecklist ? (
                                    <div className="animate-fade flex flex-col h-full overflow-hidden" key={selectedChecklist.id || Math.random()}>
                                        
                                        {/* Cabeçalho Fixo */}
                                        <div className={`p-6 border-b flex justify-between items-start flex-shrink-0 ${selectedChecklist.alertas > 0 ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200'}`}>
                                            <div>
                                                <h2 className="font-black text-xl text-slate-800 uppercase tracking-tight">{selectedChecklist.tipo}</h2>
                                                <p className="text-xs font-mono font-bold text-slate-600 mt-1">Realizado: {formatDate(selectedChecklist.dataVerificacao)} às {selectedChecklist.horaVerificacao}</p>
                                                <p className="text-xs font-bold text-slate-500 mt-2 uppercase">Viatura: {selectedChecklist.placa}</p>
                                            </div>
                                            <div className="bg-white p-2 rounded-lg shadow-sm">
                                                {selectedChecklist.alertas > 0 ? <i data-lucide="triangle-alert" className="text-red-600 w-8 h-8"></i> : <i data-lucide="badge-check" className="text-emerald-600 w-8 h-8"></i>}
                                            </div>
                                        </div>
                                        
                                        {/* Conteúdo com SCROLL INTERNO ATIVADO */}
                                        <div className="p-6 overflow-y-auto flex-1 space-y-6 bg-white">
                                            <div>
                                                <h3 className="text-[11px] font-black uppercase text-slate-400 mb-2 tracking-widest flex items-center gap-2"><i data-lucide="message-square" className="w-4 h-4"></i> Relatório Geral</h3>
                                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm font-bold text-slate-700 whitespace-pre-wrap">
                                                    {selectedChecklist.obsGerais || "Nenhuma observação registrada pelo plantão."}
                                                </div>
                                            </div>

                                            <div>
                                                <h3 className="text-[11px] font-black uppercase text-slate-400 mb-3 tracking-widest flex items-center gap-2"><i data-lucide="list-checks" className="w-4 h-4"></i> Itens da Verificação</h3>
                                                <div className="space-y-3 pb-6">
                                                    {(selectedChecklist.items || []).map((item, idx) => {
                                                        const isAlert = !['OK', 'COMPLETA', 'LACRADO', 'MC>20', 'MC>40', 'C/ LACRE'].includes(item.status);
                                                        return (
                                                            <div key={idx} className={`p-3 rounded-lg border-2 ${isAlert ? 'bg-red-50 border-red-200' : 'bg-white border-slate-100'}`}>
                                                                <div className="flex justify-between items-start gap-2">
                                                                    <span className={`text-xs font-black uppercase ${isAlert ? 'text-red-900' : 'text-slate-700'}`}>{item.nome}</span>
                                                                    <span className={`text-[10px] font-black px-2 py-1 rounded shadow-sm whitespace-nowrap uppercase ${isAlert ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-500 border border-slate-200'}`}>
                                                                        {item.status}
                                                                    </span>
                                                                </div>
                                                                {item.obs && (
                                                                    <p className={`mt-2 text-xs font-bold ${isAlert ? 'text-red-700' : 'text-slate-500'}`}>
                                                                        <i data-lucide="corner-down-right" className="w-3 h-3 inline mr-1"></i>
                                                                        {item.obs}
                                                                    </p>
                                                                )}
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="p-10 flex flex-col items-center justify-center text-center h-full opacity-60">
                                        <div className="bg-slate-100 p-4 rounded-full mb-4">
                                            <i data-lucide="mouse-pointer-click" className="w-10 h-10 text-slate-400"></i>
                                        </div>
                                        <p className="font-black text-slate-500 uppercase tracking-widest text-xs">Selecione uma verificação na tabela<br/>para visualizar os detalhes</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
