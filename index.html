<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HACO - SISTEMA SAE (V19.0 TACTICAL)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root {
            --bg-obsidian: #0A0F17;
            --panel-obsidian: #111827;
            --fab-red: #DC2626;
            --fab-red-hover: #B91C1C;
            --rescue-green: #10B981;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-obsidian); color: var(--text-primary); overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Tactical Panel Style */
        .t-panel { background-color: var(--panel-obsidian); border: 1px solid rgba(255, 255, 255, 0.03); }
        .t-border { border-color: rgba(255, 255, 255, 0.05); }

        /* Hard Button Style */
        .btn-t-primary { background-color: var(--fab-red); transition: all 0.1s ease-in-out; border-bottom: 3px solid rgba(0,0,0,0.3); }
        .btn-t-primary:active { transform: translateY(1px); border-bottom-width: 1px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ⚠️ COLE SUA URL AQUI ⚠️
        const API_URL = "SUA_URL_AQUI";

        const VIATURAS = [
            { id: 'basica', label: 'Básica', bg: 'bg-blue-950', border: 'border-blue-700', tColor: 'text-blue-400' },
            { id: 'avancada', label: 'Avançada', bg: 'bg-red-950', border: 'border-red-700', tColor: 'text-red-400' },
            { id: 'paje', label: 'PAJÉ', bg: 'bg-emerald-950', border: 'border-emerald-700', tColor: 'text-emerald-400' }
        ];

        const CATEGORIES = ["Status & VA", "Mochila Vermelha", "Meds & DEA", "Gases & Trauma", "Balcão & Finalizar"];

        // MATRIZ COMPLETA TÁTICA (Consolidada para agilidade mobile)
        const CHECKLIST = [
            // cat 0: Admin & VA
            { id: 'radio', n: 'Rádio Comunicador', cat: 0, opts: ['OK', 'FA'] },
            { id: 'carimbo', n: 'Carimbo da Viatura', cat: 0, opts: ['OK', 'FA'] },
            { id: 'bvm_kits', n: 'AMBU/BVM (Ad/Ped/Neo)', cat: 0, opts: ['OK', 'FA'] },
            { id: 'guedel_kit', n: 'Cânulas Guedel (Completo)', cat: 0, opts: ['OK', 'FALTA'] },
            // cat 1: Mochila Vermelha
            { id: 'sinais_kit', n: 'Kit Sinais Vitais (Esteto/Esfig/HGT/Oxi)', cat: 1, opts: ['OK', 'FA'] },
            { id: 'bolso_b_kit', n: 'Nebul/Sondas/Óculos/Aspiração', cat: 1, opts: ['OK', 'FA'] },
            { id: 'trauma_kit', n: 'Ataduras/Gaze/Torniquete/Manta', cat: 1, opts: ['OK', 'FA'] },
            // cat 2: Meds & DEA
            { id: 'med_geral', n: 'Medicação Geral', cat: 2, opts: ['COMPLETA', 'FA'] },
            { id: 'med_ctrl', n: 'Meds Controladas', cat: 2, opts: ['C/ LACRE', 'S/ LACRE', 'FA'] },
            { id: 'dea_kit', n: 'DEA (Status/Pás Ad-Ped/Pilhas)', cat: 2, opts: ['OK', 'FA'] },
            // cat 3: Gases & Trauma
            { id: 'o2_g_kit', n: 'O2 Grande (Torpedo 1 e 2)', cat: 3, opts: ['LACRADO', 'MC>20', 'TROCA', 'FA'] },
            { id: 'o2_p_kit', n: 'O2 Portátil (Torpedo 1 e 2)', cat: 3, opts: ['LACRADO', 'MC>40', 'TROCA', 'FA'] },
            { id: 'imob_kit', n: 'Imobilização Trauma (Ked/Talas/Maca/Velcros)', cat: 3, opts: ['OK', 'FA'] },
            // cat 4: Balcão & Finalizar
            { id: 'parede_kit', n: 'Flux/ Hudson/ Aspiração Parede', cat: 4, opts: ['OK', 'FA'] },
            { id: 'cobertor', n: 'Cobertor (1 un)', cat: 4, opts: ['OK', 'FA'] },
            { id: 'colares_kit', n: 'Colares Cervicais (Completo)', cat: 4, opts: ['OK', 'FALTA'] },
            { id: 'gaveta_kit', n: 'Chave O2/ Carr. Oxim/ Lanterna', cat: 4, opts: ['OK', 'FA'] }
        ];

        function App() {
            const [view, setView] = useState('menu'); 
            const [tab, setTab] = useState('monitor');
            const [vSel, setVSel] = useState(null);
            const [step, setStep] = useState(0);
            const [db, setDb] = useState([]);
            const [loading, setLoading] = useState(false);
            const [form, setForm] = useState({ placa: '', posto: '', guerra: '', obs: '', items: {} });

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [view, step, db, tab]);

            // --- CÉREBRO TÁTICO ---
            const audit = useMemo(() => {
                if (!db.length) return { op: 0, shifts: {}, history: [] };
                
                const today = new Date().toLocaleDateString('pt-BR');
                const conformeOptions = ['OK', 'COMPLETA', 'C/ LACRE', 'LACRADO', 'MC>20', 'MC>40'];
                const falhaOptions = ['FA', 'FALTA', 'S/ LACRE', 'TROCA'];
                
                const total = db.filter(d => d[4] !== 'INFO').length;
                const oks = db.filter(d => conformeOptions.includes(d[5].trim().toUpperCase())).length;
                
                const historyMap = db.reduce((acc, d) => {
                    if(d[4] === 'INFO') return acc;
                    const k = `${d[0]}_${d[2]}`;
                    if (!acc[k]) acc[k] = { ts: d[0], v: d[1], p: d[2], r: d[3], alertas: [] };
                    if (falhaOptions.includes(d[5].trim().toUpperCase())) {
                        acc[k].alertas.push({ nome: d[4], status: d[5], obs: d[6] || '' }); 
                    }
                    return acc;
                }, {});

                const shifts = {};
                VIATURAS.forEach(v => {
                    const logs = db.filter(d => d[1] === v.label && d[0].includes(today));
                    const check = (s, e) => {
                        const l = logs.find(d => { 
                            const match = d[0].match(/(\d{2}):/);
                            if(!match) return false;
                            return parseInt(match[1]) >= s && parseInt(match[1]) < e;
                        });
                        return l ? { ok: true, u: l[3] } : { ok: false };
                    };
                    shifts[v.label] = { M: check(7, 13), T: check(13, 19), N: check(19, 24) || check(0, 7) };
                });

                return { 
                    op: total > 0 ? Math.round((oks / total) * 100) : 0, 
                    shifts, 
                    history: Object.values(historyMap).reverse() 
                };
            }, [db]);

            // --- OPERAÇÕES ---
            const start = (v) => {
                const items = {};
                CHECKLIST.forEach(i => items[i.id] = { status: i.opts[0], obs: '' });
                setForm({ placa: '', posto: '', guerra: '', obs: '', items });
                setVSel(v);
                setStep(0);
                setView('form');
            };

            const send = async () => {
                if(!form.placa || !form.posto || !form.guerra) return alert("BLOQUEIO: Identificação Militar incompleta.");
                
                const statusCriticos = ['FA', 'FALTA', 'S/ LACRE', 'TROCA'];
                const falha = Object.entries(form.items).find(([id, v]) => statusCriticos.includes(v.status) && v.obs.trim() === '');
                
                if (falha) {
                    const nome = CHECKLIST.find(i => i.id === falha[0]).n;
                    return alert(`TRAVA DE AUDITORIA:\n\nItem: ${nome}\nStatus: ${falha[1].status}\n\nÉ OBRIGATÓRIO descrever a NC/Numeração na observação.`);
                }

                setLoading(true);
                const payload = {
                    action: 'write', tipo: vSel.label, placa: form.placa, resp: `${form.posto} ${form.guerra}`, obsGerais: form.obs,
                    items: Object.entries(form.items).map(([id, v]) => ({ nome: CHECKLIST.find(i => i.id === id).n, status: v.status, obs: v.obs }))
                };
                try {
                    await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setView('sucesso');
                } catch (e) { alert("ERRO DE REDE HACO."); }
                setLoading(false);
            };

            const sync = async () => {
                setLoading(true);
                try {
                    const r = await fetch(`${API_URL}?action=read&t=${Date.now()}`);
                    setDb(await r.json());
                    setView('admin');
                } catch (e) { alert("FALHA DE SINCRONIZAÇÃO."); }
                setLoading(false);
            };

            // --- VIEW: MENU TÁTICO ---
            if (view === 'menu') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 space-y-16 animate-fade bg-[#0A0F17]">
                    <div className="text-center space-y-3">
                        <div className="bg-red-600 w-16 h-16 rounded-lg flex items-center justify-center mx-auto shadow-xl"><i data-lucide="shield-check" className="text-white w-8 h-8"></i></div>
                        <h1 className="text-4xl font-extrabold uppercase tracking-tight text-white">SISTEMA <span className="text-red-600">SAE</span></h1>
                        <p className="text-gray-500 font-mono text-[10px] uppercase tracking-[0.5em]">Hospital de Aeronáutica de Canoas</p>
                    </div>
                    <div className="grid grid-cols-1 gap-5 w-full max-w-sm">
                        {VIATURAS.map(v => (
                            <button key={v.id} onClick={() => start(v)} className={`t-panel p-6 rounded-lg flex items-center justify-between transition-all border border-l-4 hover:border-red-600 ${v.border}`}>
                                <span className={`font-bold text-lg uppercase tracking-tight ${v.tColor}`}>{v.label}</span>
                                <i data-lucide="truck" className="text-gray-600 w-5 h-5"></i>
                            </button>
                        ))}
                    </div>
                    <button onClick={sync} className="text-gray-700 font-bold uppercase text-[10px] tracking-widest pt-10 border-t t-border w-full max-w-xs hover:text-red-500">Ops Center (TV/Desktop)</button>
                </div>
            );

            // --- VIEW: COLETOR MOBILE (TACTICAL UI) ---
            if (view === 'form') {
                const isFinal = step === CATEGORIES.length - 1;
                const items = CHECKLIST.filter(i => i.cat === step);

                return (
                    <div className="min-h-screen flex flex-col bg-[#0A0F17] pb-32 animate-fade">
                        <header className={`p-5 ${vSel.bg} flex justify-between items-center sticky top-0 z-50 rounded-b-lg shadow-xl`}>
                            <button onClick={() => setView('menu')} className="text-white opacity-60"><i data-lucide="arrow-left"></i></button>
                            <h1 className="font-bold uppercase text-xs text-white tracking-widest">{vSel.label}</h1>
                            <span className="font-mono text-[10px] font-bold text-white bg-black/40 px-3 py-1 rounded">{step + 1}/{CATEGORIES.length}</span>
                        </header>

                        <main className="p-4 space-y-6 flex-1 overflow-y-auto no-scrollbar mt-4">
                            <h2 className="text-sm font-black uppercase text-red-500 tracking-wider mb-8 flex items-center gap-3"><i data-lucide="tag" className="w-4 h-4"></i> {CATEGORIES[step]}</h2>

                            {step === 0 && (
                                <div className="space-y-5 t-panel p-6 rounded-lg shadow-lg">
                                    <input type="text" placeholder="PLACA DO VEÍCULO" className="w-full p-4 bg-black/30 border t-border rounded font-mono font-bold text-center text-xl uppercase text-white placeholder:text-gray-700 focus:border-red-600 outline-none" value={form.placa} onChange={e => setForm({...form, placa: e.target.value.toUpperCase()})} />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="text" placeholder="POSTO (1T/SG)" className="w-full p-3 bg-black/30 border t-border rounded font-bold uppercase text-white placeholder:text-gray-700 text-xs focus:border-red-600 outline-none" value={form.posto} onChange={e => setForm({...form, posto: e.target.value.toUpperCase()})} />
                                        <input type="text" placeholder="GUERRA" className="w-full p-3 bg-black/30 border t-border rounded font-bold uppercase text-white placeholder:text-gray-700 text-xs focus:border-red-600 outline-none" value={form.guerra} onChange={e => setForm({...form, guerra: e.target.value.toUpperCase()})} />
                                    </div>
                                </div>
                            )}

                            {!isFinal && items.map(i => (
                                <div key={i.id} className="t-panel p-5 rounded-lg space-y-4 shadow-md border-b-2 border-transparent hover:border-red-900 transition-colors">
                                    <span className="font-bold text-[11px] uppercase tracking-wider text-gray-400 block">{i.n}</span>
                                    <div className="flex flex-wrap gap-2 pt-1">
                                        {i.opts.map(opt => {
                                            const isF = ['FA', 'FALTA', 'S/ LACRE', 'TROCA'].includes(opt);
                                            return (
                                                <button key={opt} onClick={() => setForm({...form, items: {...form.items, [i.id]: { ...form.items[i.id], status: opt }}})} 
                                                    className={`px-4 py-2.5 rounded-sm font-bold text-[10px] flex-1 transition-all border ${form.items[i.id].status === opt ? (isF ? 'bg-red-950 border-red-600 text-red-200' : 'bg-emerald-950 border-emerald-600 text-emerald-200') : 'bg-gray-900 text-gray-500 border-gray-800'}`}>
                                                    {opt}
                                                </button>
                                            )
                                        })}
                                    </div>
                                    <input type="text" placeholder="Anotar NC / Número Lacre..." className={`w-full p-3 bg-black/30 rounded text-xs text-gray-300 placeholder:text-gray-700 border-none outline-none focus:ring-1 focus:ring-red-600 ${['FA', 'FALTA', 'S/ LACRE', 'TROCA'].includes(form.items[i.id].status) ? 'bg-red-950/20 italic placeholder:text-red-950' : ''}`} value={form.items[i.id].obs} onChange={e => setForm({...form, items: {...form.items, [i.id]: {...form.items[i.id], obs: e.target.value}}})} />
                                </div>
                            ))}

                            {isFinal && (
                                <div className="space-y-8 animate-fade mt-6">
                                    <div className="t-panel p-6 rounded-lg">
                                        <h3 className="font-bold text-gray-400 text-xs uppercase mb-3 tracking-wider">Observações Gerais do Plantão</h3>
                                        <textarea rows="4" placeholder="Descreva intercorrências da viatura, manutenções necessárias ou pendências..." className="w-full p-4 bg-black/30 rounded text-gray-300 text-xs outline-none focus:ring-1 focus:ring-red-600 placeholder:text-gray-700" value={form.obs} onChange={e => setForm({...form, obs: e.target.value})}></textarea>
                                    </div>
                                    <button onClick={send} disabled={loading} className="w-full btn-t-primary text-white font-bold py-5 rounded-lg active:scale-95 text-xs uppercase tracking-widest">
                                        {loading ? 'SINCRONIZANDO...' : 'TRANSMITIR AUDITORIA'}
                                    </button>
                                </div>
                            )}
                        </main>

                        <footer className="fixed bottom-0 left-0 right-0 p-5 t-panel border-t t-border flex gap-4 bg-[#0D121C] z-50">
                            {step > 0 && <button onClick={() => setStep(step - 1)} className="flex-1 bg-gray-900 p-4 rounded text-xs font-bold uppercase text-gray-400">Voltar</button>}
                            {!isFinal && <button onClick={() => setStep(step + 1)} className="flex-[2] bg-gray-100 text-black p-4 rounded text-xs font-bold uppercase tracking-widest">Avançar</button>}
                        </footer>
                    </div>
                );
            }

            // --- VIEW: MONITOR TV 32" (OPS CENTER) ---
            if (view === 'admin') return (
                <div className="min-h-screen flex bg-[#0A0F17] animate-fade">
                    <aside className="w-20 bg-gray-900 border-r t-border flex flex-col items-center py-10 gap-6">
                        <div className="bg-red-600 p-3 rounded-lg"><i data-lucide="radio" className="text-white w-6 h-6"></i></div>
                        <button onClick={() => setTab('monitor')} className={`p-4 rounded ${tab === 'monitor' ? 'bg-red-950 text-red-500' : 'text-gray-600'}`}><i data-lucide="layout-grid"></i></button>
                        <button onClick={() => setTab('report')} className={`p-4 rounded ${tab === 'report' ? 'bg-red-950 text-red-500' : 'text-gray-600'}`}><i data-lucide="clipboard-list"></i></button>
                        <button onClick={sync} className="p-4 text-gray-700 hover:text-white"><i data-lucide="refresh-cw" className={loading ? 'animate-spin' : ''}></i></button>
                        <button onClick={() => setView('menu')} className="mt-auto p-4 text-gray-800 hover:text-red-500"><i data-lucide="log-out"></i></button>
                    </aside>

                    <main className="flex-1 p-10 overflow-y-auto space-y-12 no-scrollbar">
                        {tab === 'monitor' ? (
                            <>
                                <header className="flex justify-between items-start border-b t-border pb-8">
                                    <div><h1 className="text-5xl font-black tracking-tight uppercase text-white leading-tight">PRONTIDÃO <span className="text-red-600">SAE</span></h1><p className="text-gray-600 font-mono text-[11px] uppercase mt-2 tracking-[0.4em]">CENTRAL DE OPERAÇÕES - HACO</p></div>
                                    <div className="t-panel p-8 rounded-lg text-center min-w-[200px] border-l-4 border-emerald-500">
                                        <span className="text-7xl font-extrabold text-emerald-400 font-mono leading-none">{audit.op}%</span>
                                        <p className="text-[10px] font-bold text-gray-600 mt-3 tracking-widest uppercase">Frota Operacional</p>
                                    </div>
                                </header>

                                <div className="grid grid-cols-3 gap-6">
                                    {VIATURAS.map(v => (
                                        <div key={v.id} className="t-panel p-6 rounded-lg relative overflow-hidden">
                                            <h4 className="text-xs font-black text-gray-500 uppercase tracking-widest mb-6 border-b t-border pb-3">{v.label}</h4>
                                            <div className="space-y-5">
                                                {['M', 'T', 'N'].map(s => {
                                                    const log = audit.shifts[v.label][s];
                                                    const name = s === 'M' ? 'MANHÃ' : s === 'T' ? 'TARDE' : 'NOITE';
                                                    return (
                                                        <div key={s} className="flex justify-between items-center">
                                                            <div><span className="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">{name}</span>{log?.ok && <span className="text-xs font-semibold text-white uppercase tracking-tighter decoration-red-600 underline decoration-2">{log.u}</span>}</div>
                                                            <i data-lucide={log?.ok ? 'check-circle' : 'circle-dashed'} className={`w-5 h-5 ${log?.ok ? 'text-emerald-500' : 'text-red-800 animate-pulse'}`}></i>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div className="space-y-12 animate-fade">
                                <h1 className="text-5xl font-black text-white tracking-tight uppercase">Histórico de <span className="text-red-600">Auditoria</span></h1>
                                <div className="space-y-6">
                                    {audit.history.slice(0, 15).map((h, i) => (
                                        <div key={i} className="t-panel p-8 rounded-lg flex flex-col gap-6 hover:bg-gray-900 transition-colors">
                                            <div className="flex justify-between items-start w-full">
                                                <div className="flex gap-8 items-center">
                                                    <span className="text-gray-600 font-mono text-sm">{h.ts}</span>
                                                    <span className="font-bold text-white text-lg w-28 uppercase tracking-tight">{h.v}</span>
                                                    <div><p className="text-red-500 font-bold uppercase text-xs tracking-wider">{h.r}</p><p className="text-[11px] text-gray-600 font-mono mt-1">{h.p}</p></div>
                                                </div>
                                                <div className={`px-4 py-2 rounded-sm text-[10px] font-black tracking-widest uppercase ${h.alertas.length === 0 ? 'bg-emerald-950 text-emerald-300' : 'bg-red-950 text-red-300'}`}>
                                                    {h.alertas.length === 0 ? 'CONFORME' : `${h.alertas.length} NC(S) REGISTRADA(S)`}
                                                </span>
                                            </div>
                                            {h.alertas.length > 0 && (
                                                <div className="pt-6 border-t t-border grid grid-cols-2 gap-4">
                                                    {h.alertas.map((al, id) => (
                                                        <div key={id} className="flex gap-4 bg-black/40 p-4 rounded border border-red-900/30">
                                                            <i data-lucide="octagon-alert" className="text-red-500 w-5 h-5 mt-0.5"></i>
                                                            <div>
                                                                <p className="text-[11px] font-bold text-white uppercase">{al.nome}</p>
                                                                <p className="text-[10px] text-red-400 font-bold uppercase mt-1">[{al.status}] - {al.obs}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );

            if (view === 'sucesso') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-8 bg-[#0A0F17] text-center animate-fade">
                    <div className="w-24 h-24 bg-emerald-950 text-emerald-500 rounded-full flex items-center justify-center mb-10 border border-emerald-800 animate-pulse"><i data-lucide="check-circle-2" className="w-12 h-12"></i></div>
                    <h1 className="text-5xl font-extrabold text-white uppercase tracking-tighter leading-none mb-10">DADOS<br/>ENVIADOS</h1>
                    <button onClick={() => { setView('menu'); window.location.reload(); }} className="w-full max-w-xs bg-gray-100 text-black font-bold py-6 rounded active:scale-95 transition-all text-xs uppercase tracking-widest">Nova Auditoria</button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
